version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./bughunter.db
      - CORS_ORIGINS=http://localhost:80,http://127.0.0.1:80
      - LLM_PROVIDER=mock
    volumes:
      - ./bughunter.db:/app/bughunter.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
